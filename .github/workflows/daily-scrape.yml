name: Daily Scholarship Scrape

on:
  schedule:
    - cron: "0 6 * * *"   # كل يوم الساعة 6:00 صباحًا UTC
  workflow_dispatch:        # يسمح بتشغيل يدوي من واجهة GitHub كمان

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run for9a spider
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: scrapy crawl for9a -o for9a_output.json

      - name: Run ministry spider
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: scrapy crawl ministry